name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base

      - name: Build app
        shell: cmd
        run: build.bat

      - name: Build installer
        shell: cmd
        run: package-installer.bat

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\MemoryGuardianSetup.exe).Hash
          "$hash  MemoryGuardianSetup.exe" | Set-Content -Encoding ASCII .\SHA256SUMS.txt
          Get-Content .\SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGuardianSetup
          path: |
            MemoryGuardianSetup.exe
            SHA256SUMS.txt
